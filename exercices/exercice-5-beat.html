<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#29AADC">
<title>Exercice 5 · Le Beat — PTK Beatbox</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#29AADC;--card:#fff;--ink:#17324a;--mut:#6b8396;--pink:#f58bb0;--cyan:#7fd6f0;--yel:#ffe27a;--vio:#b9a2f0;--ok:#3fbf6f;--amber:#ffb02e;--c:#f58bb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:Nunito,system-ui,sans-serif;color:var(--ink);touch-action:manipulation}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 30px;padding-top:max(14px,env(safe-area-inset-top))}
h1{color:#fff;font-weight:900;margin:4px 0 0;font-size:1.8rem;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.sub{color:#eaf8ff;margin:0 0 12px;font-weight:700}
body.embed h1,body.embed .sub{display:none}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin:12px 0 0;box-shadow:0 5px 0 rgba(0,0,0,.08)}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:9px 15px;cursor:pointer;background:#eef6fb;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.12)}
button:active{transform:translateY(2px);box-shadow:none}
.b-pink{background:var(--pink);color:#fff}.b-cyan{background:var(--cyan)}.b-yel{background:var(--yel)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sp{flex:1}
.small{font-size:.85rem}.muted{color:var(--mut)}

/* ============ LA « VIDÉO » ============ */
.head{position:relative;min-height:clamp(120px,17vw,160px)}
.chibi{position:absolute;right:2%;bottom:-6px;width:clamp(120px,19vw,190px);height:auto;transform-origin:50% 100%;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.10));transition:transform .35s ease-out}
.chibi.go{transition:none}
.stage{z-index:1;position:relative;container-type:inline-size;container-name:stage;aspect-ratio:16/9;background:#fff;border-radius:24px;border:.9cqw solid var(--cyan);box-shadow:0 7px 0 rgba(0,0,0,.12);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .15s}
.stage[data-ph=listen]{border-color:var(--cyan)}
.stage[data-ph=play]{border-color:var(--pink)}
.stage[data-ph=count],.stage[data-ph=idle]{border-color:var(--yel)}
.stage[data-ph=end]{border-color:var(--ok)}
.in{--pill:3.3cqw;--num:3cqw;--th:10cqw;--tfs:5cqw;--pad:14cqw;--padfs:7.5cqw;--foot:2.5cqw;--gw:84cqw;
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2.6cqw 3cqw 2.4cqw;
  background:linear-gradient(180deg,#f4fbff 0,#fff 55%)}
.stage[data-div="1"] .in{--gw:68cqw}
.stage[data-nb="8"] .in{--gw:90cqw;--th:8.6cqw;--tfs:4.4cqw}
.stage[data-nb="8"] .grid{gap:.9cqw}.stage[data-nb="8"] .beat{padding:0}
.top{display:flex;width:100%;justify-content:space-between;align-items:center}
.tag{font-weight:900;font-size:calc(var(--pill)*.8);letter-spacing:.04em;padding:.6cqw 2cqw;border-radius:10cqw;background:#eef6fb;color:var(--ink)}
.tag.lv{background:var(--yel)}
.phase{font-weight:900;font-size:var(--pill);padding:.9cqw 3.4cqw;border-radius:10cqw;box-shadow:0 .45cqw 0 rgba(0,0,0,.12);background:var(--yel);color:var(--ink);letter-spacing:.03em;white-space:nowrap}
.stage[data-ph=listen] .phase{background:var(--cyan);color:var(--ink)}
.stage[data-ph=play] .phase{background:var(--pink);color:#fff}
.stage[data-ph=end] .phase{background:var(--ok);color:#fff}

.grid{display:flex;gap:1.6cqw;width:var(--gw);justify-content:center;align-items:flex-end}
.beat{display:flex;gap:.6cqw;flex:1 1 0;min-width:0;padding:0 .3cqw;border-radius:2.6cqw}
.stage[data-and] .beat.now{background:rgba(255,226,122,.35)}
.cell.hid{visibility:hidden}
.cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.5cqw}
.lb{font-weight:900;font-size:var(--num);line-height:1;color:var(--ink);opacity:.55;height:calc(var(--num)*1.2);display:flex;align-items:flex-end}
.cell:not(.off) .lb{opacity:.9;font-size:calc(var(--num)*1.35)}

.cell.nowc .lb{opacity:1;transform:scale(1.25);transform-origin:50% 100%}
.tile{width:100%;height:var(--th);border-radius:2.4cqw;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--tfs);background:#eaf4fa;color:#a9c4d3;box-shadow:0 .5cqw 0 rgba(0,0,0,.07);transition:transform .06s}
.cell.off .lb{color:#d98a00;opacity:.95}
.cell.off .tile{background:#fff3d6;box-shadow:0 .5cqw 0 rgba(217,138,0,.18)}
.tile i{display:block;width:1.2cqw;height:1.2cqw;border-radius:50%;background:currentColor;opacity:.55}
.cell.nowc .tile{outline:.55cqw solid #ffd23f;outline-offset:.2cqw}
/* écoute : les sons sont pleins et colorés */
.cell.hit .tile{background:var(--c);color:var(--tc,#fff);box-shadow:0 .6cqw 0 rgba(0,0,0,.2)}
/* à toi : les sons sont « fantômes » (contour), ils se remplissent quand c'est à toi de jouer */
.cell.hit.fire .tile{transform:scale(1.09)}
.stage[data-ph=count] .cell.hit .tile{opacity:.5}

/* le pad : s'allume à chaque son */
.padwrap{display:flex;flex-direction:column;align-items:center;gap:.8cqw}
.pad{position:relative;width:var(--pad);height:var(--pad);border-radius:50%;background:#eaf4fa;border:.6cqw dashed #b7d3e2;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--padfs);color:#b7d3e2}
.pad .on{position:absolute;inset:-.6cqw;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;box-shadow:0 .9cqw 0 rgba(0,0,0,.2),0 0 0 0 var(--c);will-change:transform,opacity}
.pad .num{position:absolute;inset:0;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--yel);color:var(--ink);box-shadow:0 .9cqw 0 rgba(0,0,0,.15)}
.stage[data-ph=count] .pad .num{display:flex}
.padname{font-weight:900;font-size:calc(var(--foot)*1.05);letter-spacing:.12em;color:var(--mut);min-height:calc(var(--foot)*1.3)}
.stage[data-ph=play] .padname{color:#f58bb0}

.foot{display:flex;width:100%;align-items:center;justify-content:space-between;gap:2cqw;font-weight:800;font-size:var(--foot);color:var(--ink);min-height:calc(var(--foot)*2.6)}
.foot .cons{flex:1;min-width:0;line-height:1.25}
.dots{display:flex;gap:.8cqw;align-items:center;white-space:nowrap}
.dots b{width:1.7cqw;height:1.7cqw;border-radius:50%;background:#dbeaf3;display:block}
.dots b.d{background:var(--ok)}.dots b.a{background:var(--yel);box-shadow:0 0 0 .4cqw #ffd23f}
.dots span{font-weight:900;margin-right:.6cqw;color:var(--mut)}
.bpmtag{font-weight:900;color:var(--mut);white-space:nowrap}

/* voile « lecture » façon vidéo */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;gap:2.2cqw;align-items:center;justify-content:center;background:rgba(23,50,74,.16);opacity:1;transition:opacity .15s}
.stage.playing .ov{opacity:0;pointer-events:none}
.ov .pb{width:16cqw;height:16cqw;border-radius:50%;background:#fff;box-shadow:0 1cqw 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.ov .pb svg{width:7cqw;height:7cqw;margin-left:1.2cqw;fill:var(--pink)}
.ov .hint{text-align:center;font-weight:900;color:var(--ink);font-size:calc(var(--foot)*1.1);background:rgba(255,255,255,.92);padding:.7cqw 2.6cqw;border-radius:10cqw;box-shadow:0 .4cqw 0 rgba(0,0,0,.12)}

@container stage (max-width:560px){
  .in{--pill:5.4cqw;--num:4.8cqw;--th:15cqw;--tfs:7.6cqw;--pad:30cqw;--padfs:15cqw;--foot:4cqw;--gw:94cqw;padding:4cqw 3cqw 3.6cqw}
  .stage[data-div="1"] .in{--gw:92cqw}
  .stage[data-nb="8"] .in{--gw:95cqw;--th:12.5cqw;--tfs:6.6cqw;--num:4.4cqw}
  .stage[data-nb="8"] .grid{gap:.6cqw}
  .tag{font-size:3.8cqw;padding:.8cqw 3cqw}
  .lb{height:calc(var(--num)*1.2)}
  .cell.off .tile{border-radius:2.2cqw}
  .ov .pb{width:26cqw;height:26cqw}.ov .pb svg{width:11cqw;height:11cqw;margin-left:2cqw}
}
@media (max-width:640px){.stage{aspect-ratio:4/5}}

/* ============ COMMANDES ============ */
.ctrl .play{width:56px;height:56px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
.ctrl .play svg{width:24px;height:24px;fill:#fff}
.ctrl .rst{padding:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ctrl .rst svg{width:20px;height:20px;fill:var(--ink)}
.bar{position:relative;flex:1;min-width:140px;height:18px;border-radius:12px;background:#e6f2f9;overflow:hidden;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.bar u{position:absolute;top:0;bottom:0;width:3px;background:#fff;text-decoration:none}
.time{font-weight:800;font-size:.85rem;color:var(--mut);min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;border-radius:14px;overflow:hidden;border:2px solid #d5e7f2}
.seg button{border-radius:0;box-shadow:none;background:#f7fcff;padding:8px 14px;flex:1;line-height:1.15}
.seg button small{display:block;font-size:.68rem;font-weight:700;opacity:.8}
.seg button.on{background:var(--bg);color:#fff}
.lab{font-weight:800;font-size:.8rem;color:var(--mut);margin:0 0 4px}
.chip{border:2px solid #d5e7f2;border-radius:14px;padding:8px 14px;background:#f7fcff;font-weight:800;cursor:pointer;box-shadow:none}
.chip.on{background:#d9f3fc;border-color:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:end;margin-top:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
@media (max-width:640px){.chibi{width:104px;right:0}h1{font-size:1.45rem;max-width:68%}.sub{max-width:62%;font-size:.88rem;margin-bottom:8px}}
</style></head>

/* ---------- la ligne de temps : pour chaque niveau, 1 mesure de décompte puis (écoute, à toi) × tours ---------- */
let TL = [], CH = [], TOTAL = 0, MUL = 1;
function build(){
  TL = []; CH = []; let t = 0;
  EXO.levels.forEach((L, ci) => {
    const bpm = Math.round(L.bpm * MUL), spb = 60 / bpm, nb = L.beats || EXO.beats || 4, cells = L.pat.split(/\s+/), m0 = TL.length;
    const push = (type, tour) => { const nbm = type === 'count' ? 4 : nb, dur = nbm * spb; TL.push({ ch:ci, type, tour, bpm, spb, dur, div:L.div, nb:nbm, cells, t0:t }); t += dur; };
    push('count', 0);
    for(let k = 1; k <= EXO.tours; k++){ push('listen', k); push('play', k); }
    CH.push({ i:ci, m0, m1:TL.length, t0:TL[m0].t0, t1:t });
  });
  TOTAL = t;
}

function setState(s){ state = s; if(s === 'play'){ try{ parent !== window && parent.postMessage({ exoPlay:window.__EXOID || '' }, '*'); }catch(e){} } if(s !== 'play'){ const ch = $('#chibi'); if(ch){ ch.classList.remove('go'); ch.style.transform = ''; } } const st = $('#stage'); st.classList.toggle('playing', s === 'play');
  $('#icoPlay').innerHTML = s === 'play' ? '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>' : s === 'end' ? '<path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/>' : '<path d="M7 4.5v15l13-7.5z"/>';
  $('#ovHint').textContent = s === 'pause' ? 'En pause · touche pour reprendre' : s === 'end' ? 'Touche pour rejouer' : 'Touche pour lancer'; }

/* ---------- affichage ---------- */
let curCh = -1, cellEls = [], beatEls = [], cache = {};
const set = (el, k, v) => { if(cache[k] !== v){ cache[k] = v; el.textContent = v; } };
const cls = (el, k, on) => { if(cache[k] !== on){ cache[k] = on; el.classList.toggle(k.split('|')[1], on); } };
const sAnd = L => L.showAnd || L.pat.split(/\s+/).some((t, i) => i % L.div && t !== '.');
function buildGrid(ci){
  const L = EXO.levels[ci], div = L.div, cells = L.pat.split(/\s+/), g = $('#grid'); g.innerHTML = ''; cellEls = []; beatEls = []; cache = {};
  const st = $('#stage'); st.dataset.div = div; st.dataset.nb = L.beats || EXO.beats || 4; if(sAnd(L)) st.dataset.and = '1'; else delete st.dataset.and;
  const sub = div === 2 ? ['', '&'] : div === 4 ? ['', 'e', '&', 'a'] : [''];
  for(let b = 0; b < (L.beats || EXO.beats || 4); b++){ const bg = document.createElement('div'); bg.className = 'beat'; beatEls.push(bg);
    for(let k = 0; k < div; k++){ const i = b * div + k, tok = cells[i], c = document.createElement('div'); c.className = 'cell' + (k ? ' off' + (sAnd(L) ? '' : ' hid') : '') + (tok !== '.' ? ' hit' : ''); c.style.setProperty('--c', COL[tok] || COL[EXO.sound]); c.style.setProperty('--tc', INK[tok] || '#fff');
      c.innerHTML = '<span class="lb">' + (k ? '&' : (b + 1)) + '</span><div class="tile">' + (tok === '.' ? '<i></i>' : tok) + '</div>'; bg.appendChild(c); cellEls.push(c); }
    g.appendChild(bg); }
  $('#tLevel').textContent = 'NIVEAU ' + (ci + 1);
  $('#padBase').textContent = EXO.padBase || EXO.sound; $('#padOn').textContent = EXO.sound; $('#padName').textContent = EXO.padName || NAME[EXO.sound] || '';
  $('#pad').style.setProperty('--c', COL[EXO.sound]);
  [...document.querySelectorAll('#lvls button')].forEach((b, i) => b.classList.toggle('on', i === ci));
  curCh = ci;
}
function dotsHtml(tour, type){ let h = '<span>TOUR ' + Math.max(1, tour) + '/' + EXO.tours + '</span>'; for(let k = 1; k <= EXO.tours; k++) h += '<b class="' + (k < tour || (k === tour && type === 'play') ? 'd' : k === tour ? 'a' : '') + '"></b>'; return h; }
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function render(inst, tv){
  const m = inst.m; if(m.ch !== curCh) buildGrid(m.ch);
  const L = EXO.levels[m.ch], st = $('#stage'), n = m.nb * m.div, pos = Math.max(0, Math.min(.9999, (tv - inst.acStart) / inst.dur)), cd = inst.dur / n, ci = Math.min(n - 1, Math.floor(pos * n)), age = (tv - inst.acStart) - ci * cd, started = tv >= inst.acStart;
  if(st.dataset.ph !== m.type){ st.dataset.ph = m.type; }
  set($('#phase'), 'ph', m.type === 'listen' ? 'ÉCOUTE' : m.type === 'play' ? 'À TOI !' : 'PRÊT ?');
  const info = m.type === 'count' ? 'Niveau ' + (m.ch + 1) + ' · ' + L.short : m.type === 'listen' ? 'Regarde et écoute.' : L.cons;
  set($('#cons'), 'cons', info);
  const dots = dotsHtml(m.tour, m.type); if(cache.dots !== dots){ cache.dots = dots; $('#dots').innerHTML = dots; }
  set($('#bpmTag'), 'bpm', '♪ ' + m.bpm + ' BPM');
  const beat = Math.floor(pos * m.nb);
  cellEls.forEach((c, i) => { const now = started && i === ci; const onb = !(i % m.div), bi = Math.floor(ci / m.div), offHit = (ci % m.div) && m.cells[ci] !== '.';
    const lit = started && m.type !== 'count' && (sAnd(L) ? now : (onb && i / m.div === bi));
    cls(c, 'i' + i + '|nowc', lit);
    const tok = m.cells[i], fire = now && tok !== '.' && m.type !== 'count'; cls(c, 'f' + i + '|fire', fire); });
  beatEls.forEach((b, i) => cls(b, 'b' + i + '|now', started && m.type !== 'count' && i === Math.floor(ci / m.div)));
  // pad
  const tok = m.cells[ci]; if(started && m.type !== 'count' && tok !== '.' && age >= 0){ const key = inst.mi + ':' + ci; if(!lastHit || lastHit.key !== key) lastHit = { key, t:inst.acStart + ci * cd, tok }; }
  const on = $('#padOn'), pad = $('#pad');
  if(m.type === 'count'){ set($('#padNum'), 'pn', String(beat + 1)); const bph = (pos * m.nb) - beat; $('#padNum').style.transform = 'scale(' + (1 + .12 * Math.max(0, 1 - bph * 3)) + ')'; on.style.opacity = 0; }
  else if(lastHit){ const f = Math.max(0, 1 - (tv - lastHit.t) / .3); on.style.opacity = f; on.style.transform = 'scale(' + (1 + .16 * f) + ')'; on.style.background = COL[lastHit.tok] || COL[EXO.sound]; on.style.color = INK[lastHit.tok] || '#fff'; set(on, 'on', lastHit.tok); }
  else on.style.opacity = 0;
  { const ch = $('#chibi'); if(ch){ ch.classList.add('go'); ch.style.transform = started ? 'rotate(' + (4 * Math.cos(Math.PI * pos * m.nb)).toFixed(2) + 'deg)' : ''; } }
  // barre
  const vt = m.t0 + pos * m.dur; $('#barFill').style.width = (100 * vt / TOTAL) + '%'; set($('#time'), 'tm', fmt(vt) + ' / ' + fmt(TOTAL));
}
function renderEnd(){
  const st = $('#stage'); st.dataset.ph = 'end'; $('#phase').textContent = 'BRAVO !'; $('#cons').textContent = 'Tu as terminé l\'exercice ' + EXO.num + ' : ' + EXO.title + '. Rejoue-le quand tu veux, ou boucle un niveau pour t\'entraîner.';
  $('#padOn').style.opacity = 0; $('#barFill').style.width = '100%'; $('#time').textContent = fmt(TOTAL) + ' / ' + fmt(TOTAL); $('#dots').innerHTML = dotsHtml(EXO.tours, 'play'); cache.ph = null; cache.cons = null; cache.dots = null;
}
function frame(){
  raf = requestAnimationFrame(frame);
  const tv = ac.currentTime - (ac.outputLatency || 0);
  while(q.length > 1 && q[1].acStart <= tv) q.shift();
  const inst = q[0]; if(!inst) return;
  if(inst.end){ if(tv >= inst.acStart){ stopLoops(); setState('end'); renderEnd(); } return; }
  render(inst, tv);
}

/* ---------- première image (avant de lancer) ---------- */
function poster(ci){ buildGrid(ci); const L = EXO.levels[ci], m = CH[ci]; const st = $('#stage'); st.dataset.ph = 'idle'; $('#phase').textContent = 'PRÊT ?'; $('#cons').textContent = 'Niveau ' + (ci + 1) + ' · ' + L.short; $('#dots').innerHTML = dotsHtml(1, 'listen'); $('#bpmTag').textContent = '♪ ' + TL[m.m0].bpm + ' BPM'; $('#padOn').style.opacity = 0; $('#barFill').style.width = (100 * m.t0 / TOTAL) + '%'; $('#time').textContent = fmt(m.t0) + ' / ' + fmt(TOTAL); cache = {}; }

/* ---------- commandes ---------- */
function initUI(){
  $('#lvls').innerHTML = EXO.levels.map((L, i) => '<button data-i="' + i + '">Niv ' + (i + 1) + '<small>' + L.short + '</small></button>').join('');
  $('#lvls').onclick = e => { const b = e.target.closest('[data-i]'); if(!b) return; playFrom(CH[+b.dataset.i].m0); };
  const bar = $('#bar'); EXO.levels.forEach((L, i) => { if(i){ const u = document.createElement('u'); u.dataset.i = i; bar.appendChild(u); } });
  const placeMarks = () => [...bar.querySelectorAll('u')].forEach(u => { u.style.left = (100 * CH[+u.dataset.i].t0 / TOTAL) + '%'; }); placeMarks();
  bar.onclick = e => { const r = bar.getBoundingClientRect(), t = (e.clientX - r.left) / r.width * TOTAL; let k = TL.findIndex(m => t < m.t0 + m.dur); if(k < 0) k = TL.length - 1; playFrom(k); };
  $('#tempo').onclick = e => { const b = e.target.closest('[data-m]'); if(!b) return; const cur = state === 'play' || state === 'pause' ? (q[0] && q[0].mi != null ? q[0].mi : 0) : -1; MUL = +b.dataset.m; [...$('#tempo').children].forEach(x => x.classList.toggle('on', x === b)); build(); placeMarks(); if(cur >= 0) playFrom(cur); else poster(0); };
  $('#bLoop').onclick = () => { loopOn = !loopOn; $('#bLoop').classList.toggle('on', loopOn); };
  $('#bPlay').onclick = e => { e.stopPropagation(); toggle(); };
  $('#bRst').onclick = () => playFrom(0);
  $('#stage').onclick = () => toggle();
  document.addEventListener('keydown', e => { if(e.code === 'Space' && !/BUTTON|INPUT/.test(e.target.tagName)){ e.preventDefault(); toggle(); } });
  document.addEventListener('visibilitychange', () => { if(document.hidden && state === 'play') toggle(); });
}
$('#h1').textContent = 'Exercice ' + EXO.num + ' · ' + EXO.title; $('#sub').textContent = EXO.intro; $('#tTitle').textContent = EXO.tag;
window.addEventListener('message', e => { if(e.data && e.data.exoPause && state === 'play') toggle(); });
build(); initUI(); poster(0); setState('idle');
/* petit crochet pour les tests */
window.__exo = { TL:() => TL, CH:() => CH, state:() => state, playFrom, toggle, q:() => q, ac:() => ac };
</script>
